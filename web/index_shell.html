<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:,">
	<title>Bread, Fish, Repeat 5000x</title>
	<style>
		html, body {
			margin: 0;
			height: 100%;
			overflow: hidden;
			background: #111;
		}
		body {
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
		}
		canvas {
			display: block;
			border: 0;
			background: #000;
			flex-shrink: 0;
			cursor: none;
		}
	</style>
</head>
<body>
	<canvas id="canvas" width="960" height="540" tabindex="0"
		oncontextmenu="event.preventDefault()"
		onmousedown="event.target.focus()"
		onkeydown="event.preventDefault()"></canvas>
	<script src="odin.js"></script>
	<script>
		const SAVE_KEY = "fivek:save_fivek.bin";
		const CAREER_KEY = "fivek:career_stats";
		const INTRO_PREFS_KEY = "fivek:intro_prefs";
		const ACHIEVEMENTS_KEY = "fivek:achievements";
		if (new URLSearchParams(location.search).has("clearSave")) {
			localStorage.removeItem(SAVE_KEY);
			localStorage.removeItem(CAREER_KEY);
			localStorage.removeItem(INTRO_PREFS_KEY);
			localStorage.removeItem(ACHIEVEMENTS_KEY);
			history.replaceState(null, "", location.pathname);
		}

		(function () {
			var ua = navigator.userAgent || "";
			var coarse =
				(navigator.maxTouchPoints > 0 && window.matchMedia("(pointer: coarse)").matches) ||
				/Android|iPhone|iPad|iPod|Mobile/i.test(ua);
			if (coarse) {
				alert(
					"Bread, Fish, Repeat 5000x needs a keyboard and mouse. " +
						"Touch phones and tablets are not supported."
				);
			}
		})();

		var odinMemoryInterface = new odin.WasmMemoryInterface();
		odinMemoryInterface.setIntSize(4);
		var odinImports = odin.setupDefaultImports(odinMemoryInterface);

		var Module = {
			instantiateWasm: (imports, successCallback) => {
				const newImports = { ...odinImports, ...imports };
				return WebAssembly.instantiateStreaming(fetch("index.wasm"), newImports).then(function(output) {
					var e = output.instance.exports;
					odinMemoryInterface.setExports(e);
					odinMemoryInterface.setMemory(e.memory);
					return successCallback(output.instance);
				});
			},
			onRuntimeInitialized: () => {
				var e = wasmExports;
				e._start();
				e.main_start();
				document.getElementById("canvas").focus();

				function do_main_update() {
					if (!e.main_update()) {
						e.main_end();
						e._end();
						return;
					}
					window.requestAnimationFrame(do_main_update);
				}
				window.requestAnimationFrame(do_main_update);
			},
			canvas: document.getElementById("canvas"),
		};
	</script>
	{{{ SCRIPT }}}
</body>
</html>
